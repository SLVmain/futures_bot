[project]
name = "futures-bot"
version = "0.1.0"
description = "Telegram-assisted Bitunix futures trading bot"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2,<2",
    "python-telegram-bot>=22.8,<23",
    "requests>=2.34,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-mock>=3.14,<4",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
